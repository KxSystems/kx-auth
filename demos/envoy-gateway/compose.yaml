# compose.yaml — Keycloak (the IdP) + Envoy (the gateway) + a KDB-X q host running kx.auth / kx.rbac.
#
# Driven by scripts/run.sh, which generates the credentials and asserts on the outcome. Paths are relative
# to this file's directory, so `docker compose -f demos/envoy-gateway/compose.yaml` works from the repo root.
#
# run.sh also writes a .env file alongside this one, so plain `docker compose -f … logs`/`down` works
# afterwards with nothing exported. That is what makes `run.sh --keep` usable by hand.

name: kx-auth-envoy-gateway

services:

  # ── the IdP ─────────────────────────────────────────────────────────────────────────────────────────
  # KC_HOSTNAME_URL pins the issuer to http://localhost:8081 so the `iss` claim is STABLE. Without it
  # Keycloak derives the issuer from each request's Host header, and a token minted via localhost:8081
  # would not match Envoy's configured issuer when Envoy fetches JWKS as keycloak:8080 — a 401 at the
  # gateway with nothing in the logs to explain it. Envoy still reaches the JWKS over the compose network;
  # the issuer STRING and the JWKS URL are independent, which is the whole reason this works.
  #
  # 8081 rather than Keycloak's idiomatic 8080 because 8080 is the single most contended port on a
  # developer machine. It is published as 8081 and therefore MINTS 8081 in `iss`, so envoy.yaml's three
  # `issuer:` lines and its authorization_endpoint have to say 8081 too — change one, change all four.
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_URL: http://localhost:8081
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/realm-kx.json:/opt/keycloak/data/import/realm-kx.json:ro
    ports:
      - "8081:8080"

  # ── the q host ──────────────────────────────────────────────────────────────────────────────────────
  q:
    image: ${KDBX_Q_IMAGE:-portal.dl.kx.com/kdbx-q:5.0.20260723-rocky9-r1}
    # kdb+ reads its console from stdin. Without this the container's stdin is closed, q sees EOF and
    # exits immediately after loading host.q — which looks exactly like a script error and is not one.
    stdin_open: true
    # Run as the host user that generated the -U password file, so that file stays 0600 instead of being
    # widened to suit the image's default uid 10001. Falls back to the image's own uid when unset, which
    # is what a bare `docker compose up` outside run.sh gets.
    user: "${DEMO_RUN_UID:-10001}:${DEMO_RUN_GID:-10001}"
    # The -U userpass file is generated by run.sh into .run/ under this shared directory and mounted
    # explicitly below. Keeping it here (rather than macOS's unshared /var/folders temp path) prevents
    # Docker Desktop from silently producing an empty directory at the mount target.
    command: ["q", "/opt/app/q-scripts/host.q", "-U", "/opt/app/.run/userpass", "-p", "5010", "-q"]
    environment:
      DEMO_Q_PORT: "5010"
      DEMO_HEALTH_USER: healthcheck
      DEMO_HEALTH_PW: ${DEMO_HEALTH_PW:-health-demo-pw}
    volumes:
      # The demo scripts. The image's WORKDIR is /opt/app and it is owned by uid 10001 (`kx`).
      - .:/opt/app:ro
      # Explicit because Docker Desktop can omit a newly-created hidden child from an already-shared
      # directory when composing from a temporary worktree. The source exists before `compose up`.
      - ./.run/userpass:/opt/app/.run/userpass:ro
      # The modules, mounted into the REAL module path. $QHOME is /opt/kx and q defaults QPATH to
      # $QHOME/mod, so `use `kx.auth` resolves exactly as it would from an install — which is the one
      # thing the flat-\l test suite structurally cannot exercise (see docs/q-gotchas.md).
      - ../../modules/kx/auth:/opt/kx/mod/kx/auth:ro
      - ../../modules/kx/rbac:/opt/kx/mod/kx/rbac:ro
    secrets:
      - source: kdbx_license
        target: /run/secrets/kx/kc.lic
    healthcheck:
      # NOT the image's own kdbx-healthcheck: that opens an ANONYMOUS handle, which this host refuses at
      # the -U password gate, so it would report a healthy process as unhealthy. Same idea, with a login.
      test: ["CMD", "q", "/opt/app/q-scripts/ready.q", "-q"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 3s
    ports:
      # PUBLISHED DELIBERATELY. A proxy is a boundary only if it is the sole path to the node, and this
      # port is the bypass — raw qIPC straight past Envoy. The demo publishes it in order to PROVE the
      # bypass exists and then close it with activatePerimeter[]; a deployment does not publish it.
      - "5010:5010"

  # ── the gateway ─────────────────────────────────────────────────────────────────────────────────────
  envoy:
    image: ${ENVOY_IMAGE:-envoyproxy/envoy:v1.31-latest}
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "${ENVOY_LOG_LEVEL:-warning}"]
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./envoy/principal.lua:/etc/envoy/principal.lua:ro
    depends_on:
      q:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "10000:10000"   # the correct gateway
      - "10001:10001"   # the deliberately forgeable one
      - "10002:10002"   # the browser persona's oauth2 redirect flow
      - "9901:9901"     # Envoy's admin endpoint — /ready is how run.sh knows it is up

secrets:
  # The kdbx images take a licence ONLY as a file at $QLIC (/run/secrets/kx); there is no
  # KDB_LICENSE_B64 env path in them. run.sh defaults this to ~/.kx/kc.lic.
  kdbx_license:
    file: ${KDBX_LICENSE_FILE:?run.sh must export KDBX_LICENSE_FILE}
