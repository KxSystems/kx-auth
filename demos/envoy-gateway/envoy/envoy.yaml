# envoy.yaml — the gateway in front of q. Three listeners, differing in exactly what they teach.
#
#   :10000  gateway     the CORRECT configuration. Strip-then-set. This is the one to copy.
#   :10001  forgeable   DELIBERATELY MISCONFIGURED: no strip. Identity is forgeable here, on purpose.
#   :10002  browser     the oauth2 filter — the browser persona's redirect flow.
#
# The filter chain on :10000 and :10001 is otherwise identical, and the two differ in ONE line of route
# metadata (`strip_client_principal`). That is the whole lesson of spec constraint 2: the control is in the
# proxy config, not in q, and one missing line hands identity to the client.
#
# DEMO CREDENTIALS ARE IN THIS FILE IN CLEARTEXT. That is fine for a demo whose passwords are generated by
# run.sh from the same literals and thrown away on exit; it is obviously not a deployment pattern. In a real
# deployment the upstream credential belongs in an SDS secret or, better, is replaced by mTLS — see the
# demo README. run.sh asserts the base64 below still matches the -U file it writes, so the two cannot drift.
#
#   Basic ZW52b3lwcm94eTplbnZveS1kZW1vLXB3         = envoyproxy:envoy-demo-pw
#   Basic aW50cnVkZXI6aW50cnVkZXItZGVtby1wdw==     = intruder:intruder-demo-pw

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:

    # ── :10000 — the correct gateway ────────────────────────────────────────────────────────────────
    - name: gateway
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: gateway
                codec_type: AUTO
                route_config:
                  name: gateway_routes
                  virtual_hosts:
                    - name: kdbx
                      domains: ["*"]
                      routes:

                        # RFC 9728 protected-resource metadata. THIS ROUTE IS THE INTERACTIVE-LOGIN FIX:
                        # `kx auth login --server http://localhost:10000` discovers the authorization
                        # server from here and needs no new CLI flag, because Envoy IS the resource
                        # server. A static JSON document is the entire mechanism.
                        #
                        # It must be UNAUTHENTICATED (a client discovers where to get a token before it
                        # has one — see the jwt_authn rules below, which exempt /.well-known) and it must
                        # answer 200 at this exact path. The CLI runs httpx with follow_redirects=False and
                        # calls raise_for_status(), so a 301 to a trailing-slash variant fails discovery.
                        - match: { path: "/.well-known/oauth-protected-resource" }
                          direct_response:
                            status: 200
                            body:
                              inline_string: |
                                {"resource":"http://localhost:10000",
                                 "authorization_servers":["http://localhost:8081/realms/kx"],
                                 "scopes_supported":["openid","profile"],
                                 "bearer_methods_supported":["header"]}
                          response_headers_to_add:
                            - header: { key: content-type, value: application/json }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD

                        # The trusted-asserter BACKSTOP route. Same proxy, same validated JWT, same
                        # principal header — but it authenticates to q as `intruder`, a login that clears
                        # the password gate and holds no `assert grant. serveHttp must refuse the
                        # assertion, which is what makes constraint 1 a POLICY question rather than a
                        # trust-the-network assumption. /as-intruder/whoami -> /whoami upstream.
                        - match: { prefix: "/as-intruder/" }
                          route:
                            cluster: kdbx
                            prefix_rewrite: "/"
                          metadata:
                            filter_metadata:
                              envoy.filters.http.lua:
                                strip_client_principal: true
                          request_headers_to_add:
                            - header: { key: authorization, value: "Basic aW50cnVkZXI6aW50cnVkZXItZGVtby1wdw==" }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD

                        # Everything else: the real data routes, as the trusted proxy login.
                        #
                        # GRANULAR NAMED ROUTES are the precondition for the proxy's authorization buying
                        # anything (see the rbac filter below). A single POST /query carrying arbitrary q
                        # would present one route for every operation, so the proxy could distinguish no
                        # resources at all without parsing the body — a declared non-goal.
                        - match: { prefix: "/" }
                          route: { cluster: kdbx }
                          metadata:
                            filter_metadata:
                              envoy.filters.http.lua:
                                # ── CONSTRAINT 2, satisfied. Remove this line and read the :10001 comment.
                                strip_client_principal: true
                          request_headers_to_add:
                            - header: { key: authorization, value: "Basic ZW52b3lwcm94eTplbnZveS1kZW1vLXB3" }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD

                http_filters:
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        keycloak:
                          # THE VALIDATOR. This is the half of the topology q will never provide: the
                          # signature is checked against Keycloak's JWKS here, so a bearer becomes a
                          # credential rather than a claims carrier.
                          issuer: http://localhost:8081/realms/kx
                          audiences: [kdbx]
                          forward: false          # the client's bearer never reaches q — q does no crypto
                          payload_in_metadata: jwt_payload
                          remote_jwks:
                            http_uri:
                              uri: http://keycloak:8080/realms/kx/protocol/openid-connect/certs
                              cluster: keycloak
                              timeout: 5s
                            cache_duration: { seconds: 300 }
                            async_fetch: {}
                      rules:
                        # Discovery is deliberately open — a client cannot present a token it has not
                        # been told how to acquire. A rule with no `requires` imposes none.
                        - match: { prefix: "/.well-known/" }
                        - match: { prefix: "/" }
                          requires: { provider_name: keycloak }

                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        filename: /etc/envoy/principal.lua

                  # PEP-1, RELOCATED. The proxy decides CAPABILITY — "may you reach this route" — from the
                  # verified claims, and nothing more. DENY-shaped so there is no rule-ordering trap: the
                  # trader-only routes refuse a non-trader, everything else authenticated passes.
                  #
                  # Note /accounts is ALLOWED here to a trader. q refuses the RESOURCE anyway, because
                  # nobody holds `read on `data.accounts. Same 403, different enforcer — PEP-2 is unmovable
                  # because only the node sees the data.
                  - name: envoy.filters.http.rbac
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                      rules:
                        action: DENY
                        policies:
                          non-trader-on-trader-routes:
                            permissions:
                              - or_rules:
                                  rules:
                                    - url_path: { path: { exact: "/trades" } }
                                    - url_path: { path: { exact: "/accounts" } }
                            principals:
                              - not_id:
                                  metadata:
                                    filter: envoy.filters.http.jwt_authn
                                    path:
                                      - key: jwt_payload
                                      - key: realm_access
                                      - key: roles
                                    value:
                                      list_match:
                                        one_of:
                                          string_match: { exact: trader }

                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # ── :10001 — the DELIBERATELY MISCONFIGURED gateway ─────────────────────────────────────────────
    # Identical to :10000 except that the route carries NO `strip_client_principal`. The Lua projection
    # therefore APPENDS its header instead of replacing, a client-supplied `x-kx-principal` survives, and
    # kdb+ hands `serveHttp` two dict entries of which it matches the FIRST — the client's.
    #
    # So a caller with a valid token for a `viewer` sends one header and reads as a `trader`. q cannot tell
    # the forgery from the real thing: the assertion arrived on the trusted connection, from a login that
    # holds the grant, in the expected shape. NOTHING in the module can defend this, which is exactly why
    # it is demonstrated rather than documented. The audit line is the only evidence, and the fix is one
    # line of proxy config.
    - name: forgeable
      address:
        socket_address: { address: 0.0.0.0, port_value: 10001 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: forgeable
                codec_type: AUTO
                route_config:
                  name: forgeable_routes
                  virtual_hosts:
                    - name: kdbx
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: kdbx }
                          # ── NO strip_client_principal. THIS IS THE BUG, and it is the whole point.
                          request_headers_to_add:
                            - header: { key: authorization, value: "Basic ZW52b3lwcm94eTplbnZveS1kZW1vLXB3" }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                http_filters:
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        keycloak:
                          issuer: http://localhost:8081/realms/kx
                          audiences: [kdbx]
                          forward: false
                          payload_in_metadata: jwt_payload
                          remote_jwks:
                            http_uri:
                              uri: http://keycloak:8080/realms/kx/protocol/openid-connect/certs
                              cluster: keycloak
                              timeout: 5s
                            cache_duration: { seconds: 300 }
                            async_fetch: {}
                      rules:
                        - match: { prefix: "/" }
                          requires: { provider_name: keycloak }
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        filename: /etc/envoy/principal.lua
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # ── :10002 — the browser persona ────────────────────────────────────────────────────────────────
    # The oauth2 filter runs an auth-code + PKCE redirect against Keycloak, which is the OTHER thing q will
    # never do: `kx auth login` implements device-code only, so without a proxy there is no interactive
    # flow for a dashboard user at all.
    #
    # Kept on its own listener so it cannot interfere with the bearer-token API calls the checks make. The
    # checks assert that an unauthenticated request here REDIRECTS to Keycloak, which is what proves the
    # flow is wired; completing the login is a browser exercise, described in the demo README.
    - name: browser
      address:
        socket_address: { address: 0.0.0.0, port_value: 10002 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: browser
                codec_type: AUTO
                route_config:
                  name: browser_routes
                  virtual_hosts:
                    - name: kdbx
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: kdbx }
                          metadata:
                            filter_metadata:
                              envoy.filters.http.lua:
                                strip_client_principal: true
                          request_headers_to_add:
                            - header: { key: authorization, value: "Basic ZW52b3lwcm94eTplbnZveS1kZW1vLXB3" }
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                http_filters:
                  - name: envoy.filters.http.oauth2
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.oauth2.v3.OAuth2
                      config:
                        token_endpoint:
                          cluster: keycloak
                          uri: http://keycloak:8080/realms/kx/protocol/openid-connect/token
                          timeout: 5s
                        authorization_endpoint: http://localhost:8081/realms/kx/protocol/openid-connect/auth
                        redirect_uri: "http://localhost:10002/oauth2/callback"
                        redirect_path_matcher:
                          path: { exact: /oauth2/callback }
                        signout_path:
                          path: { exact: /signout }
                        forward_bearer_token: true
                        credentials:
                          client_id: envoy-gateway
                          token_secret:
                            name: oauth2_client_secret
                          hmac_secret:
                            name: oauth2_hmac_secret
                        auth_scopes: [openid, profile]
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        keycloak:
                          issuer: http://localhost:8081/realms/kx
                          audiences: [kdbx]
                          forward: false
                          payload_in_metadata: jwt_payload
                          remote_jwks:
                            http_uri:
                              uri: http://keycloak:8080/realms/kx/protocol/openid-connect/certs
                              cluster: keycloak
                              timeout: 5s
                            cache_duration: { seconds: 300 }
                            async_fetch: {}
                      rules:
                        - match: { prefix: "/oauth2/" }
                        - match: { prefix: "/" }
                          requires: { provider_name: keycloak }
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        filename: /etc/envoy/principal.lua
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # kdb+ serves HTTP and qIPC on ONE port. That is why closing the raw-qIPC bypass is a GRANT
    # (activatePerimeter[]) rather than a network rule — no segmentation can separate "reach /trades"
    # from "eval arbitrary q" when both arrive on 5010.
    #
    # Note also that kdb+ answers every HTTP request with Connection: close and closes the socket, so
    # Envoy cannot pool upstream connections here. Harmless, and worth knowing before tuning anything.
    - name: kdbx
      connect_timeout: 2s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: kdbx
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: q, port_value: 5010 }

    - name: keycloak
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: keycloak
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: keycloak, port_value: 8080 }

  secrets:
    - name: oauth2_client_secret
      generic_secret:
        secret: { inline_string: "envoy-gateway-demo-secret" }
    - name: oauth2_hmac_secret
      generic_secret:
        secret: { inline_string: "a-demo-hmac-signing-key-of-sufficient-length" }
